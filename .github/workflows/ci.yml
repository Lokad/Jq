name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Lokad.Jq.slnx --locked-mode
      - name: Build Release
        run: dotnet build Lokad.Jq.slnx -c Release --no-restore
      - name: Test Release
        run: dotnet test Lokad.Jq.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Pack Release
        run: dotnet pack src/Lokad.Jq/Lokad.Jq.csproj -c Release --no-build --no-restore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/
          if-no-files-found: ignore
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/nuget/
          if-no-files-found: error
